repos:
  # Ruff from uv.lock, so commits are checked by the same version as CI and Dependabot's uv updates bump it.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
  # Biome lints and formats the TypeScript and JSON. It runs the version package-lock.json pins, so `npm ci` first.
  - repo: local
    hooks:
      - id: biome-check
        name: biome check
        entry: npx --no-install biome check --write --files-ignore-unknown=true --no-errors-on-unmatched
        language: system
        types_or: [javascript, jsx, ts, tsx, json]
