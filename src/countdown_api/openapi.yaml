# The countdown API contract. Edit this file; releases publish it as openapi.yaml.
# `info.version` is a placeholder: the release workflow stamps it from the tag.
openapi: 3.1.0
info:
  title: countdown API
  version: 0.0.0-dev
  description: What the countdown renderer and the auth-broker say to each other. The released file is the single
    source of truth for both; see the README.
paths:
  /api/config:
    get:
      operationId: getConfig
      summary: The renderer's config.
      parameters:
      - name: X-Device-Name
        in: header
        required: false
        description: The device's own name, for logs and admin output. Never its identity.
        schema:
          type: string
      security:
      - deviceSecret:
        - renderer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '401':
          description: Missing or unknown secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: A valid secret for a role this endpoint doesn't allow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    deviceSecret:
      type: http
      scheme: bearer
  schemas:
    ConfigResponse:
      description: GET /api/config.
      properties:
        device_id:
          type: string
        interval:
          type: integer
          exclusiveMinimum: 0
          description: Seconds between updates.
        clock_format:
          enum:
          - 12h
          - 24h
          default: 24h
          type: string
          description: Application-wide format for user-facing clock times. Does not change machine timestamps,
            durations, time zones or log formats. Optional, so a broker that doesn't send it gets 24h.
        language:
          enum:
          - en
          - nb
          default: en
          type: string
          description: The language of everything the screen shows, as a BCP 47 code (nb is Norwegian Bokmål).
            Optional, so a broker that doesn't send it gets en.
        timezone:
          default: Europe/London
          type: string
          description: The screen's IANA time zone, e.g. Europe/Oslo, for its clock and what counts as today.
            Optional, so a broker that doesn't send it gets Europe/London.
        style:
          anyOf:
          - enum:
            - airy
            - hero
            - card
            type: string
          - type: 'null'
          default: null
          description: How every panel is drawn (the departures, Spotify and the notice board, and any panel added
            later), so the screen has one look. airy has small-caps labels over a hairline, like the weather; hero
            has an icon header over a heavy rule and makes the first item big; card puts each panel in a rounded
            card with a black title bar. A renderer that reads it ignores tfl.style, departures.style,
            spotify.style and notice_board.style, which a broker keeps sending for older renderers. Optional, so a
            broker that doesn't send it leaves the renderer on those.
        screen:
          $ref: '#/components/schemas/Screen'
        weather:
          $ref: '#/components/schemas/Weather'
        notice_board:
          $ref: '#/components/schemas/NoticeBoard'
        tfl:
          $ref: '#/components/schemas/Tfl'
        departures:
          anyOf:
          - $ref: '#/components/schemas/Departures'
          - type: 'null'
          default: null
          description: Every stop whose departures the screen shows, from any source, in the owner's order. A
            renderer that reads it ignores tfl.stop_ids and tfl.style. Optional, so a broker that doesn't send it
            leaves the renderer on tfl.
        spotify:
          $ref: '#/components/schemas/Spotify'
        glowmarkt:
          $ref: '#/components/schemas/Glowmarkt'
        developer:
          anyOf:
          - $ref: '#/components/schemas/Developer'
          - type: 'null'
          default: null
          description: The developer panel (GitHub pull requests and builds, AI plans). Optional, so a broker that
            doesn't send it leaves the panel off.
        apple_music:
          anyOf:
          - $ref: '#/components/schemas/AppleMusic'
          - type: 'null'
          default: null
          description: Apple Music, shown in the Spotify area beside or instead of Spotify. Optional, so a broker
            that doesn't send it leaves it off.
        pairing_code:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - device_id
      - interval
      - screen
      - weather
      - notice_board
      - tfl
      - spotify
      - glowmarkt
      - pairing_code
      title: ConfigResponse
      type: object
    DepartureStop:
      properties:
        source:
          enum:
          - tfl
          - entur
          type: string
          description: Who to ask for the stop's departures. tfl is Transport for London; entur is Norway's
            national journey planner (Ruter and every other Norwegian operator).
        id:
          type: string
          description: The stop's id at its source. A NaPTAN id for tfl (490000077E, 940GZZLUOVL); an NSR
            StopPlace or Quay for entur (NSR:StopPlace:58381, NSR:Quay:7333).
      required:
      - source
      - id
      title: DepartureStop
      type: object
    Departures:
      properties:
        stops:
          items:
            $ref: '#/components/schemas/DepartureStop'
          type: array
        style:
          enum:
          - classic
          - hero
          - grouped
          - card
          default: hero
          type: string
          description: How each stop's departures are drawn, the same for every source. Superseded by style; see
            tfl.style for the values.
      required:
      - stops
      title: Departures
      type: object
    AppleMusic:
      properties:
        enabled:
          type: boolean
          description: Whether the Spotify area shows Apple Music too. Its data comes from the broker's
            /api/apple-music in /api/spotify's shapes, which holds the Apple token, so no token is sent here. Apple
            Music has no now playing or queue, so that is what was played last and before it, and top tracks and
            artists the broker counts from the plays it has seen.
      required:
      - enabled
      title: AppleMusic
      type: object
    Developer:
      properties:
        enabled:
          type: boolean
          description: Whether the screen shows the developer panel. Its data comes from the broker's
            /api/developer, which holds the GitHub token, so no token is sent here.
      required:
      - enabled
      title: Developer
      type: object
    Error:
      properties:
        error:
          type: string
      required:
      - error
      title: Error
      type: object
    Glowmarkt:
      properties:
        enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          description: Whether the screen shows the energy panel. Its data comes from the store, which the broker's
            Glowmarkt provider fills, so no credentials are sent here. Optional; a renderer that gets null (a broker
            that predates it) shows the panel when username and password are both non-blank.
        username:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          deprecated: true
          description: Deprecated and no longer sent, since the energy data comes from the store. A broker sends
            null explicitly, because renderers that predate enabled require the key. To be removed in a later
            contract change.
        password:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          deprecated: true
          description: Deprecated and no longer sent, since the energy data comes from the store. A broker sends
            null explicitly, because renderers that predate enabled require the key. To be removed in a later
            contract change.
      title: Glowmarkt
      type: object
    NoticeBoard:
      properties:
        postcode:
          anyOf:
          - type: string
          - type: 'null'
        country:
          anyOf:
          - enum:
            - 'GB'
            - 'NO'
            type: string
          - type: 'null'
          default: null
          description: The postcode's country (ISO 3166-1 alpha-2), which decides the local notices. Optional;
            without it a postcode is taken to be British.
        style:
          enum:
          - airy
          - hero
          - card
          - boxed
          default: hero
          type: string
          description: How the notice board is drawn. airy, hero and card match the Spotify styles of the same name
            (a small-caps label over a hairline; an icon header over a heavy rule; a rounded card with a black title
            bar); boxed puts it in a square box with a black title bar and a count. Optional, so a broker that doesn't
            send it gets hero. Superseded by style, which has no boxed; a renderer that reads this field alone draws
            boxed as card.
      required:
      - postcode
      title: NoticeBoard
      type: object
    Screen:
      properties:
        orientation:
          enum:
          - horizontal
          - vertical
          type: string
        width:
          type: integer
        height:
          type: integer
      required:
      - orientation
      - width
      - height
      title: Screen
      type: object
    Spotify:
      properties:
        enabled:
          type: boolean
        style:
          enum:
          - classic
          - airy
          - hero
          - card
          default: hero
          type: string
          description: How the Spotify panel is drawn, now playing and top tracks alike. airy has small-caps
            labels like the weather; hero has an icon header and makes the top track big, like the hero arrivals;
            card puts it in a rounded card with a black title bar. Optional, so a broker that doesn't send it gets
            hero. classic, the original look, is retired; it is still accepted, so an older broker that sends it
            keeps validating, and it is drawn as hero. Superseded by style.
      required:
      - enabled
      title: Spotify
      type: object
    Tfl:
      properties:
        app_key:
          type: string
        stop_ids:
          items:
            type: string
          type: array
        style:
          enum:
          - classic
          - hero
          - grouped
          - card
          default: hero
          type: string
          description: How each stop's departures are drawn. hero makes the next departure big; grouped gives
            each route one row with its next few times; card puts the stop in a rounded card with a column of
            minutes. Optional, so a broker that doesn't send it gets hero. classic, the original row per departure
            under a black header, is retired; it is still accepted, so an older broker that sends it keeps
            validating, and it is drawn as hero. Superseded by style, where grouped is called airy.
      required:
      - app_key
      - stop_ids
      title: Tfl
      type: object
    Weather:
      properties:
        api_key:
          type: string
        location:
          type: string
      required:
      - api_key
      - location
      title: Weather
      type: object
