# The countdown API contract. Edit this file; releases publish it as openapi.yaml.
# `info.version` is a placeholder: the release workflow stamps it from the tag.
openapi: 3.1.0
info:
  title: countdown API
  version: 0.0.0-dev
  description: What the countdown renderer and the auth-broker say to each other. The released file is the single
    source of truth for both; see the README.
paths:
  /api/config:
    get:
      operationId: getConfig
      summary: The renderer's config.
      parameters:
      - name: X-Device-Name
        in: header
        required: false
        description: The device's own name, for logs and admin output. Never its identity.
        schema:
          type: string
      security:
      - deviceSecret:
        - renderer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '401':
          description: Missing or unknown secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: A valid secret for a role this endpoint doesn't allow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    deviceSecret:
      type: http
      scheme: bearer
  schemas:
    ConfigResponse:
      description: GET /api/config.
      properties:
        device_id:
          type: string
        interval:
          type: integer
          exclusiveMinimum: 0
          description: Seconds between updates.
        screen:
          $ref: '#/components/schemas/Screen'
        weather:
          $ref: '#/components/schemas/Weather'
        notice_board:
          $ref: '#/components/schemas/NoticeBoard'
        tfl:
          $ref: '#/components/schemas/Tfl'
        spotify:
          $ref: '#/components/schemas/Spotify'
        glowmarkt:
          $ref: '#/components/schemas/Glowmarkt'
        pairing_code:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - device_id
      - interval
      - screen
      - weather
      - notice_board
      - tfl
      - spotify
      - glowmarkt
      - pairing_code
      title: ConfigResponse
      type: object
    Error:
      properties:
        error:
          type: string
      required:
      - error
      title: Error
      type: object
    Glowmarkt:
      properties:
        username:
          anyOf:
          - type: string
          - type: 'null'
        password:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - username
      - password
      title: Glowmarkt
      type: object
    NoticeBoard:
      properties:
        postcode:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - postcode
      title: NoticeBoard
      type: object
    Screen:
      properties:
        orientation:
          enum:
          - horizontal
          - vertical
          type: string
        width:
          type: integer
        height:
          type: integer
      required:
      - orientation
      - width
      - height
      title: Screen
      type: object
    Spotify:
      properties:
        enabled:
          type: boolean
        style:
          enum:
          - classic
          - airy
          - hero
          - card
          default: classic
          type: string
          description: How the Spotify panel is drawn, now playing and top tracks alike. classic is the
            original look; airy has small-caps labels like the weather; hero has an icon header and makes the
            top track big, like the hero arrivals; card puts it in a rounded card with a black title bar.
            Optional, so a broker that doesn't send it gets classic.
      required:
      - enabled
      title: Spotify
      type: object
    Tfl:
      properties:
        app_key:
          type: string
        stop_ids:
          items:
            type: string
          type: array
        style:
          enum:
          - classic
          - hero
          - grouped
          - card
          default: classic
          type: string
          description: How each stop's departures are drawn. classic is a row per departure under a black header;
            hero makes the next departure big; grouped gives each route one row with its next few times; card
            puts the stop in a rounded card with a column of minutes. Optional, so a broker that doesn't send it
            gets classic.
      required:
      - app_key
      - stop_ids
      title: Tfl
      type: object
    Weather:
      properties:
        api_key:
          type: string
        location:
          type: string
      required:
      - api_key
      - location
      title: Weather
      type: object
