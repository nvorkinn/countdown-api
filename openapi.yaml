# DEPRECATED: the HTTP API is gone. auth-broker and pi-dashboard share only Redis, whose contract is store.yaml.
# This is what is left of the old GET /api/config, kept only so that countdown_api.clients and
# countdown_api.blueprints stay importable until both repositories use the store contract; it goes with them.
# generate.py adds store.yaml's schemas as its components, so ConfigResponse has one source.
openapi: 3.1.0
info:
  title: countdown API (deprecated)
  # generate.py puts store.yaml's version here.
  version: 0.0.0-dev
  description: Deprecated. The old GET /api/config, which nothing serves or calls any more; see store.yaml.
paths:
  /api/config:
    get:
      operationId: getConfig
      summary: The renderer's config.
      parameters:
      - name: X-Device-Name
        in: header
        required: false
        description: The device's own name, for logs and admin output. Never its identity.
        schema:
          type: string
      security:
      - deviceSecret:
        - renderer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '401':
          description: Missing or unknown secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: A valid secret for a role this endpoint doesn't allow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    deviceSecret:
      type: http
      scheme: bearer
  schemas:
    Error:
      properties:
        error:
          type: string
      required:
      - error
      title: Error
      type: object
