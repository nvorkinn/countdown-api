[project]
name = "countdown-api"
# A placeholder: this project isn't released on its own, so whatever builds it gives it a version (`uv version`).
version = "0.0.0"
description = "The Redis store contract between the countdown broker and its renderers: the keys, the schemas of their values, the Lua scripts, canonical examples, and the code generated from them."
license = "MIT"
requires-python = ">=3.14"
dependencies = ["pydantic"]

[build-system]
requires = ["uv_build>=0.12.0,<0.14.0"]
build-backend = "uv_build"

# src/countdown_api/ is committed, but generate.py writes most of it from store.yaml (with openapi-codegen for the
# models): run `python generate.py` after changing the contract. CI fails if it is out of date.
# src/countdown_api/fixtures/ is not generated: those are the contract's canonical examples.

# openapi-codegen comes from its release tag. The lock records the commit the tag named, so installs stay on it even if
# the tag moves. Not the release's wheel: Dependabot's uv updates can't download GitHub release files (they fail with
# private_source_authentication_failure), which stopped every update of uv.lock here and in countdown. To move to a
# newer release, change the tag here and run `uv lock --upgrade-package openapi-codegen`.
[tool.uv.sources]
openapi-codegen = { git = "https://github.com/nvorkinn/openapi-codegen", tag = "v2.1.0" }

[dependency-groups]
# pytest and jsonschema for the contract's own tests (tests/), which check every example against the schemas.
dev = [
    "jsonschema>=4.25",
    "openapi-codegen[yaml]",
    "pre-commit",
    "pyicumessageformat>=1.0.0",
    "pytest>=8.4",
    "ruff",
]

[tool.ruff]
line-length = 120

# Everything is linted, the generated code in src/countdown_api included: openapi-codegen writes code that passes
# every rule except these, which contradict each other (D203/D213 with D211/D212), clash with the formatter
# (COM812, ISC001) or ask for a policy (CPY001, a copyright notice).
[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213", "COM812", "ISC001", "CPY001"]

# Pydantic models need their imports at run time, not only for type checking.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
"generate.py" = ["T201"] # a command-line script: printing is its output
"tests/**" = [
    "S101",    # pytest is built on assert
    "PLR2004", # a test compares against the literal values it expects
    "D1",      # a test's name says what it checks
    "INP001",  # tests/ is a pytest rootdir, not a package
]

[tool.pytest.ini_options]
testpaths = ["tests"]
