[project]
name = "countdown-api"
# Stamped from the release's tag when it is built (`uv version`); this is only a placeholder for checkouts.
version = "0.0.0"
description = "The countdown Redis store contract between auth-broker and pi-dashboard: the keys, the schemas of their values, the Lua scripts, canonical examples, and the code generated from them."
license = "MIT"
requires-python = ">=3.14"
dependencies = ["pydantic>=2.13"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

# src/countdown_api/ is committed, but generate.py writes most of it from store.yaml (with openapi-codegen for the
# models): run `python generate.py` after changing the contract. CI fails if it is out of date.
# src/countdown_api/fixtures/ is not generated: those are the contract's canonical examples.

# openapi-codegen is a dependency like any other, but of a released file, not a git ref: the lock records the
# wheel's hash, so a build fails if that file ever changes. To move to a newer release, change the URL here and
# run `uv lock --upgrade-package openapi-codegen`.
[tool.uv.sources]
openapi-codegen = { url = "https://github.com/nvorkinn/openapi-codegen/releases/download/v2.1.0/openapi_codegen-2.1.0-py3-none-any.whl" }

[dependency-groups]
# pytest and jsonschema for the contract's own tests (tests/), which check every example against the schemas.
dev = ["jsonschema>=4.25", "openapi-codegen[yaml]", "pre-commit", "pytest>=8.4", "ruff"]

[tool.ruff]
line-length = 120

# Everything is linted, the generated code in src/countdown_api included: openapi-codegen writes code that passes
# every rule except these, which contradict each other (D203/D213 with D211/D212), clash with the formatter
# (COM812, ISC001) or ask for a policy (CPY001, a copyright notice).
[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213", "COM812", "ISC001", "CPY001"]

# Pydantic models need their imports at run time, not only for type checking.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
"scripts/make_site.py" = ["E501", "INP001"] # long HTML template lines; a script, not a package
"generate.py" = ["T201"] # a command-line script: printing is its output
"tests/**" = [
    "S101",    # pytest is built on assert
    "PLR2004", # a test compares against the literal values it expects
    "D1",      # a test's name says what it checks
    "INP001",  # tests/ is a pytest rootdir, not a package
]

[tool.pytest.ini_options]
testpaths = ["tests"]
