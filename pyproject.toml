[project]
name = "countdown-api"
# Stamped from the release's tag when it is built (`uv version`); this is only a placeholder for checkouts.
version = "0.0.0"
description = "The API between the countdown renderer and auth-broker: the contract, and the code generated from it."
license = "MIT"
requires-python = ">=3.14"
dependencies = ["pydantic>=2.13"]

# Each side of the API needs one of these: the renderer the `requests` client, the broker the Flask views.
[project.optional-dependencies]
client = ["requests>=2.32"]
server = ["flask>=3.1"]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

# src/countdown_api/ is committed, but openapi-codegen writes it from openapi.yaml: run `python generate.py` after
# changing the contract. The workflows regenerate it just before building the wheel (see .github/workflows/ci.yml).

# openapi-codegen is a dependency like any other, but of a released file, not a git ref: the lock records the
# wheel's hash, so a build fails if that file ever changes. To move to a newer release, change the URL here and
# run `uv lock --upgrade-package openapi-codegen`.
[tool.uv.sources]
openapi-codegen = { url = "https://github.com/nvorkinn/openapi-codegen/releases/download/v2.0.0/openapi_codegen-2.0.0-py3-none-any.whl" }

[dependency-groups]
dev = ["openapi-codegen[yaml]", "pre-commit", "ruff"]

[tool.ruff]
line-length = 120

# Everything is linted, the generated code in src/countdown_api included: openapi-codegen writes code that passes
# every rule except these, which contradict each other (D203/D213 with D211/D212), clash with the formatter
# (COM812, ISC001) or ask for a policy (CPY001, a copyright notice).
[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213", "COM812", "ISC001", "CPY001"]

# Pydantic models need their imports at run time, not only for type checking.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
"scripts/make_site.py" = ["E501", "INP001"] # long HTML template lines; a script, not a package
