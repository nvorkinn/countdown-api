name: Pages

# Publishes the project's GitHub Pages site, https://nvorkinn.github.io/countdown-api/, on every push to main and
# after every release (the Release workflow calls this). A Pages deployment replaces the whole site, so both build
# all of it:
#
# - the latest release's files at fixed addresses, as a flat package index (scripts/make_site.py), and
# - schema/, the reference: main's store.yaml as an OpenAPI document (`generate.py --openapi`), shown with Scalar.
#
# Settings > Pages > Source must be "GitHub Actions", and the github-pages environment must allow both the branch
# `main` and tags `v*` to deploy (Settings > Environments).
on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never a cancelled one: the newest queued run is what ends up published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # main, whatever started the run (a release's tag is on main), with the tags, for the release's commit.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Install openapi-codegen
        run: uv sync --frozen --no-install-project
      - name: Download the latest release's files
        run: |
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir dist
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: Build the site
        run: |
          python3 scripts/make_site.py dist site "$TAG" "$GITHUB_REPOSITORY" "$(git rev-parse "$TAG^{commit}")"
          echo "countdown-api==${TAG#v}" > site/constraints.txt
      - name: Write the reference's OpenAPI document from main's contract
        run: |
          uv run --frozen --no-sync python generate.py \
            --openapi site/schema/openapi.json --version "main@$(git rev-parse --short HEAD), after $TAG"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
