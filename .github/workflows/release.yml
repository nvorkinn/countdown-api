name: Release

# Every merge to main that changes openapi.yaml publishes it as the next GitHub release, and that release becomes the
# latest one. Consumers fetch
#
#   https://github.com/nvorkinn/countdown-api/releases/latest/download/openapi.yaml
#
# on every build and generate from it, so that URL is the whole interface: it is the same whatever version of any
# repo is asking. Nobody picks a version: CI takes the latest release's and adds one to the patch number (v1.0.0 for
# the first), stamps it into the published file and creates the tag on the commit it built. The version only labels
# a release; consumers always use the latest, so there is no bump to get right.

on:
  push:
    branches: [main]
    paths: [openapi.yaml]
  workflow_dispatch:

permissions:
  contents: read

# One release at a time, so two merges can't both compute the same next version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Next version
        id: version
        run: |
          latest=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases \
            --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -z "$latest" ]; then
            next="1.0.0"
          else
            if ! [[ "$latest" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::The latest release is $latest, which isn't v<major>.<minor>.<patch>."
              exit 1
            fi
            next="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
          fi
          echo "Latest release: ${latest:-none}; this one: v$next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
      - name: Stamp version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          sed "s/^  version: 0.0.0-dev\$/  version: $VERSION/" openapi.yaml > dist/openapi.yaml
          grep -q "^  version: $VERSION\$" dist/openapi.yaml || { echo "::error::No placeholder version to stamp."; exit 1; }
      - name: Checksums
        working-directory: dist
        run: sha256sum openapi.yaml | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # No --clobber: a published file is never replaced. --target makes the tag on the commit that was built.
      - name: Create the GitHub release
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --generate-notes --latest
