name: Release

# Pushing a tag v<version> (from main) publishes the store contract, store.yaml, and the wheel generate.py builds
# from it (countdown_api-<version>-py3-none-any.whl, which carries the contract as store.json, the Lua and the
# examples too) as a GitHub release, and makes it the latest one. The version is stamped into the contract and the
# wheel from the tag (GITHUB_REF_NAME). Until the HTTP API's leftovers go, the deprecated openapi.yaml is published
# beside it, as before.
#
# The release is also published to the project's GitHub Pages site, https://nvorkinn.github.io/countdown-api/. It is
# a flat package index listing the latest wheel, so a consumer that depends on countdown-api and points uv at it
# finds the latest version there (`uv lock --upgrade-package countdown-api`) and records it, with its hash, in its
# own lockfile. The links point at the release's own files, which stay when the next release replaces the page.
#
# A tag push is the only way in: there is no manual trigger. If a run fails part-way, re-run it from the Actions tab
# (same tag); if the release was already created, the files are added to it.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  # The tag that triggered the run (GITHUB_REF_NAME); the first step makes sure it is one.
  TAG: ${{ github.ref_name }}

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      # The trigger already only matches tags; this keeps the workflow safe if that ever changes.
      - name: Verify the run is for a tag
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::This runs on a pushed tag, not a $GITHUB_REF_TYPE ($GITHUB_REF_NAME)."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$(git rev-parse "$TAG^{commit}")" origin/main; then
            echo "::error::Tag $TAG does not point at a commit on main."
            exit 1
          fi

  build:
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v5
      - name: Stamp version
        run: |
          case "$TAG" in
            v*) ;;
            *) echo "::error::The tag is $TAG, but release tags are v<version>, e.g. v1.0.0."; exit 1 ;;
          esac
          mkdir dist
          sed -i "s/^  version: 0.0.0-dev\$/  version: ${TAG#v}/" store.yaml
          grep -q "^  version: ${TAG#v}\$" store.yaml || { echo "::error::No placeholder version to stamp."; exit 1; }
          cp store.yaml dist/
      - name: Install openapi-codegen and ruff
        run: uv sync --frozen --no-install-project
      # generate.py run on the stamped contract, then built into the wheel: what is built here is what gets
      # published. The wheel carries the contract too, and takes its version from the tag.
      - name: Build the wheel from the contract
        run: |
          uv run --frozen --no-sync python generate.py
          cp src/countdown_api/openapi.yaml dist/openapi.yaml
          uv version --frozen "${TAG#v}"
          uv build --wheel --out-dir dist
      - name: Checksums
        working-directory: dist
        run: sha256sum -- store.yaml openapi.yaml *.whl | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # No --clobber: a published file is never replaced, so a hash recorded for it stays valid; if a file is
      # already on the release this stops rather than swapping it.
      - name: Create the GitHub release if there isn't one
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$TAG" --generate-notes --latest --verify-tag
          fi
      - name: Upload the contract, the code built from it and the checksums
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"

  # The website: the same files at fixed addresses, always the latest release's. Settings > Pages > Source must be
  # "GitHub Actions", and the github-pages environment must allow tag `v*` to deploy (Settings > Environments).
  pages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Build the site
        run: python3 scripts/make_site.py dist site "$TAG" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
      - name: Publish the release's version as a uv constraints file
        run: echo "countdown-api==${TAG#v}" > site/constraints.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
