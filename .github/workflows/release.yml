name: Release

# Pushing a tag v<version> (from main) publishes the contract, openapi.yaml, and the code openapi-codegen builds from
# it (countdown_api-client.tar.gz, countdown_api-server.tar.gz) as a GitHub release, and makes it the latest one.
# Consumers fetch, e.g.,
#
#   https://github.com/nvorkinn/countdown-api/releases/latest/download/countdown_api-client.tar.gz
#
# on every build, so those URLs are the whole interface: the same whatever version of any repo is asking. The
# version is stamped into the published contract from the tag (GITHUB_REF_NAME), before the code is built from it.
# A tag push is the only way in: there is no manual trigger. If a run fails part-way, re-run it from the Actions tab
# (same tag); if the release was already created, the files are added to it. The release is also published to the
# project's GitHub Pages site, which always shows the latest one (https://nvorkinn.github.io/countdown-api/).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  # The tag that triggered the run (GITHUB_REF_NAME); the first step makes sure it is one.
  TAG: ${{ github.ref_name }}

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      # The trigger already only matches tags; this keeps the workflow safe if that ever changes.
      - name: Verify the run is for a tag
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::This runs on a pushed tag, not a $GITHUB_REF_TYPE ($GITHUB_REF_NAME)."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$(git rev-parse "$TAG^{commit}")" origin/main; then
            echo "::error::Tag $TAG does not point at a commit on main."
            exit 1
          fi

  build:
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Stamp version
        run: |
          case "$TAG" in
            v*) ;;
            *) echo "::error::The tag is $TAG, but release tags are v<version>, e.g. v1.0.0."; exit 1 ;;
          esac
          mkdir dist
          sed "s/^  version: 0.0.0-dev\$/  version: ${TAG#v}/" openapi.yaml > dist/openapi.yaml
          grep -q "^  version: ${TAG#v}\$" dist/openapi.yaml || { echo "::error::No placeholder version to stamp."; exit 1; }
      - name: Install openapi-codegen
        run: uv sync --frozen
      # openapi-codegen run on the stamped contract: what is built here is what gets published.
      - name: Build the code from the contract
        run: |
          for side in client:clients server:blueprints; do
            name="${side%%:*}"; only="${side#*:}"
            uv run --frozen openapi-codegen dist/openapi.yaml --out "build/$name/countdown_api" --only "$only"
            uv run --frozen openapi-codegen dist/openapi.yaml --out "build/$name/countdown_api" --only "$only" --check
            # Sorted, no timestamps or owners, no name in the gzip header: the same code is the same bytes.
            tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner --exclude=__pycache__ \
              -cf - -C "build/$name" countdown_api | gzip -n > "dist/countdown_api-$name.tar.gz"
          done
      - name: Checksums
        working-directory: dist
        run: sha256sum -- openapi.yaml *.tar.gz | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # No --clobber: a published file is never replaced, so a hash recorded for it stays valid; if a file is
      # already on the release this stops rather than swapping it.
      - name: Create the GitHub release if there isn't one
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$TAG" --generate-notes --latest --verify-tag
          fi
      - name: Upload the contract, the code built from it and the checksums
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"

  # The website: the same files at fixed addresses, always the latest release's. Settings > Pages > Source must be
  # "GitHub Actions", and the github-pages environment must allow tag `v*` to deploy (Settings > Environments).
  pages:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Build the site
        run: python3 scripts/make_site.py dist site "$TAG" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
