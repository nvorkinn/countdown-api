name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      # openapi-codegen comes from a release of its repository, whose hash uv.lock records; the dev group also has
      # ruff (which generate.py formats with), pytest and jsonschema.
      - name: Install the dev tools and the package
        run: uv sync --frozen
      # src/countdown_api is committed, so it has to be what generate.py writes from store.yaml (and lua/, and the
      # deprecated openapi.yaml): `python generate.py` brings it up to date.
      - name: Check src/countdown_api is up to date with store.yaml
        run: uv run --frozen python generate.py --check
      - name: Ruff
        run: |
          uv run --frozen ruff check --output-format=github .
          uv run --frozen ruff format --check --diff .
      # Every canonical example is what the schemas allow (jsonschema and the generated models both), under the key
      # and TTL the contract gives it.
      - name: Test the contract
        run: uv run --frozen pytest -q
      - name: Build the wheel
        run: |
          uv build --wheel --out-dir dist
          ls -l dist
      # What a consumer installs: the models need only pydantic, and the contract, the Lua and the examples come in
      # the wheel. The deprecated extras still install and import, until they go.
      - name: Install the wheel, and with each deprecated extra, then import it
        run: |
          for side in base:models,keys,scripts,fixtures client:models,clients server:models,blueprints; do
            extra="${side%%:*}"; modules="${side#*:}"
            spec="$(ls dist/*.whl)"; [ "$extra" = base ] || spec="$spec[$extra]"
            uv venv --python 3.14 "$RUNNER_TEMP/$extra"
            uv pip install --python "$RUNNER_TEMP/$extra/bin/python" "$spec"
            cd "$RUNNER_TEMP"
            for module in ${modules//,/ }; do "$extra/bin/python" -I -c "import countdown_api.$module"; done
            cd "$GITHUB_WORKSPACE"
          done
          cd "$RUNNER_TEMP"
          base/bin/python -I -c "
          import importlib.resources as r
          from countdown_api import fixtures, keys, scripts
          assert r.files('countdown_api').joinpath('store.json').is_file()
          assert fixtures.load('config_store.json')['key'] == keys.config('a1b2c3d4e5f6')
          assert len(fixtures.read_bytes('frame_record.bin')) == 48000
          assert scripts.ENQUEUE.sha1 == fixtures.load('render_queue.json')['enqueue_sha1']
          "
