name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      # openapi-codegen comes from a release of its repository, whose hash uv.lock records. Not the project itself:
      # its code doesn't exist until openapi-codegen has written it.
      - name: Install openapi-codegen
        run: uv sync --frozen --no-install-project
      # src/countdown_api is committed, so it has to be what openapi-codegen writes for the current openapi.yaml:
      # `python generate.py` brings it up to date. This runs before the build step, which regenerates it.
      - name: Check src/countdown_api is up to date with openapi.yaml
        run: |
          uv run --frozen --no-sync openapi-codegen openapi.yaml --out src/countdown_api --package countdown_api --check
          diff openapi.yaml src/countdown_api/openapi.yaml
      # What a release publishes: openapi-codegen run on openapi.yaml (the models, the requests client and the Flask
      # views), then built into a wheel that also carries the contract.
      - name: Build the wheel from openapi.yaml
        run: |
          mkdir dist
          cp openapi.yaml dist/
          uv run --frozen --no-sync openapi-codegen dist/openapi.yaml --out src/countdown_api --package countdown_api
          cp dist/openapi.yaml src/countdown_api/openapi.yaml
          uv build --wheel --out-dir dist
          ls -l dist
      # Each side of the API installs with its own extra and must import without the other's dependency.
      - name: Install the wheel with each extra, then import it
        run: |
          for side in client:models,clients server:models,blueprints; do
            extra="${side%%:*}"; modules="${side#*:}"
            uv venv --python 3.14 "$RUNNER_TEMP/$extra"
            uv pip install --python "$RUNNER_TEMP/$extra/bin/python" "$(ls dist/*.whl)[$extra]"
            cd "$RUNNER_TEMP"
            for module in ${modules//,/ }; do "$extra/bin/python" -I -c "import countdown_api.$module"; done
            "$extra/bin/python" -I -c "import importlib.resources as r; assert r.files('countdown_api').joinpath('openapi.yaml').is_file()"
            cd "$GITHUB_WORKSPACE"
          done
