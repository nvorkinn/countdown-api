name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # openapi-codegen comes from a release of its repository, whose hash uv.lock records.
      - name: Install
        run: uv sync --frozen
      # What a release publishes: the code generated from openapi.yaml, each side checked and built.
      - name: Build the code from openapi.yaml
        run: uv run --frozen python scripts/build.py openapi.yaml build
      - name: Import what was built
        run: |
          for side in client:models,clients server:models,blueprints; do
            dir="$(mktemp -d)"
            tar xzf "build/countdown_api-${side%%:*}.tar.gz" -C "$dir"
            uv run --frozen python -I scripts/check_imports.py "$dir" "${side#*:}"
          done
      # The release also publishes a website built from the same files; make sure it still builds.
      - name: Build the site
        run: |
          mkdir dist
          cp openapi.yaml build/*.tar.gz dist/
          (cd dist && sha256sum -- openapi.yaml *.tar.gz > SHA256SUMS)
          python scripts/make_site.py dist site v0.0.0 "$GITHUB_REPOSITORY" "$GITHUB_SHA"
          test -f site/index.html && test -f site/countdown_api-client.tar.gz && python -c "import json; json.load(open('site/latest.json'))"
