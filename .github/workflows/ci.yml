name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # openapi-generator, which writes the C++ headers (cpp/countdown_api), is a Java program.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      # openapi-codegen comes from a release of its repository, whose hash uv.lock records; the dev group also has
      # ruff (which generate.py formats with), pytest and jsonschema.
      - name: Install the dev tools and the package
        run: uv sync --frozen
      # openapi-typescript, TypeScript (to check what it writes), Biome and openapi-generator's command, pinned by
      # package-lock.json; the command downloads the openapi-generator openapitools.json pins when it first runs.
      - name: Install openapi-typescript, TypeScript, Biome and openapi-generator
        run: npm ci
      # src/countdown_api and cpp/countdown_api are committed, so they have to be what generate.py writes from
      # store.yaml (and lua/, and templates/cpp): `python generate.py` brings them up to date.
      - name: Check src/countdown_api and cpp/countdown_api are up to date with store.yaml
        run: uv run --frozen python generate.py --check
      # tsconfig.json: strict, noUncheckedIndexedAccess and exactOptionalPropertyTypes.
      - name: Type-check the TypeScript types and client
        run: npx --no-install tsc -p .
      # client.ts against a fake fetch: what each route sends and answers (Node strips the types).
      - name: Test the TypeScript client
        run: node --test tests/*.test.ts
      # Lint and format check of the TypeScript and JSON (biome.json), the generated files and the fixtures included.
      - name: Biome
        run: npx --no-install biome ci --reporter=github .
      - name: Ruff
        run: |
          uv run --frozen ruff check --output-format=github .
          uv run --frozen ruff format --check --diff .
      # Every canonical example is what the schemas allow (jsonschema and the generated models both), under the key
      # and TTL the contract gives it; and the C++ headers, built with the runner's compiler, write those examples.
      - name: Test the contract
        run: uv run --frozen pytest -q
      - name: Build the wheel
        run: |
          uv build --wheel --out-dir dist
          ls -l dist
      # What a consumer installs: the models need only pydantic, and the contract, the Lua and the examples come in
      # the wheel.
      - name: Install the wheel, then import it
        run: |
          uv venv --python 3.14 "$RUNNER_TEMP/base"
          uv pip install --python "$RUNNER_TEMP/base/bin/python" "$(ls dist/*.whl)"
          cd "$RUNNER_TEMP"
          for module in models keys scripts fixtures; do base/bin/python -I -c "import countdown_api.$module"; done
          base/bin/python -I -c "
          import importlib.resources as r
          from countdown_api import fixtures, keys, scripts
          assert r.files('countdown_api').joinpath('store.json').is_file()
          assert fixtures.load('config_store.json')['key'] == keys.config('a1b2c3d4e5f6')
          assert len(fixtures.read_bytes('frame_record.bin')) == 48000
          assert scripts.ENQUEUE.sha1 == fixtures.load('render_queue.json')['enqueue_sha1']
          "
